<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Octagon background -->
  <polygon points="72.1,9.2 90.8,27.9 90.8,72.1 72.1,90.8 27.9,90.8 9.2,72.1 9.2,27.9 27.9,9.2" fill="#C46B35"/>
  <!-- Octagon border -->
  <polygon points="72.1,9.2 90.8,27.9 90.8,72.1 72.1,90.8 27.9,90.8 9.2,72.1 9.2,27.9 27.9,9.2" fill="none" stroke="#F5F0E8" stroke-width="1.5"/>
  <!-- 8-pointed star: two overlapping squares (Khatam) -->
  <g stroke="#F5F0E8" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <rect x="23.4" y="23.4" width="53.2" height="53.2"/>
    <rect x="23.4" y="23.4" width="53.2" height="53.2" transform="rotate(45 50 50)"/>
  </g>
  <!-- Inner octagon -->
  <polygon points="63.6,23.2 76.8,36.4 76.8,63.6 63.6,76.8 36.4,76.8 23.2,63.6 23.2,36.4 36.4,23.2" fill="none" stroke="#F5F0E8" stroke-width="1"/>
  <!-- Accent star (8-pointed) -->
  <polygon points="56.8,37.1 52.6,45.4 59.9,43.2 54.6,50 59.9,56.8 52.6,54.6 56.8,62.9 50,58 43.2,62.9 47.4,54.6 40.1,56.8 45.4,50 40.1,43.2 47.4,45.4 43.2,37.1 50,42" fill="#F5F0E8" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="#C46B35"/>
  <!-- Gold ring -->
  <circle cx="50" cy="50" r="6" fill="none" stroke="#C4953A" stroke-width="1.2"/>
</svg>
